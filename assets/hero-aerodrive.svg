<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-label="AeroDrive hero illustration — three-quarter view">
  <defs>
    <linearGradient id="sky" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#EEF2FF"/>
      <stop offset="1" stop-color="#F6F5F2"/>
    </linearGradient>
    <linearGradient id="body" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#0F172A"/>
      <stop offset=".5" stop-color="#1F2A44"/>
      <stop offset="1" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#2B4CFF" stop-opacity=".35"/>
      <stop offset="1" stop-color="#2B4CFF" stop-opacity=".10"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
  </defs>

  <rect width="800" height="500" fill="url(#sky)"/>

  <!-- Ground shadow -->
  <ellipse cx="430" cy="410" rx="300" ry="20" fill="#0F172A" opacity=".12" filter="url(#soft)"/>

  <!-- Car body silhouette -->
  <path d="M140 360 C 190 320 260 295 360 290 C 470 285 600 295 680 315 L 700 325 L 705 360 L 690 390 L 680 395 L 160 395 L 140 385 Z" fill="url(#body)"/>

  <!-- Greenhouse -->
  <path d="M265 295 L 340 235 L 550 230 L 620 290 L 625 315 L 260 315 Z" fill="#0F172A"/>
  <path d="M275 293 L 345 243 L 545 239 L 610 288 L 260 300 Z" fill="url(#glass)"/>

  <!-- Window split -->
  <path d="M430 240 L 430 294" stroke="#0F172A" stroke-width="2" opacity=".45"/>

  <!-- Wheel wells -->
  <ellipse cx="230" cy="395" rx="48" ry="40" fill="#0F172A"/>
  <ellipse cx="600" cy="395" rx="48" ry="40" fill="#0F172A"/>
  <circle cx="230" cy="395" r="30" fill="#1F2A44" stroke="#475569" stroke-width="3"/>
  <circle cx="600" cy="395" r="30" fill="#1F2A44" stroke="#475569" stroke-width="3"/>
  <circle cx="230" cy="395" r="10" fill="#475569"/>
  <circle cx="600" cy="395" r="10" fill="#475569"/>

  <!-- Accent strip (AeroDrive signature line) -->
  <path d="M160 370 L 690 370" stroke="#2B4CFF" stroke-width="2" opacity=".7"/>

  <!-- Headlight cluster -->
  <path d="M150 345 L 190 338 L 195 360 L 155 365 Z" fill="#EEF2FF" opacity=".75"/>
  <path d="M180 345 L 205 341 L 207 355 L 182 359 Z" fill="#2B4CFF" opacity=".55"/>

  <!-- Rear light cluster -->
  <path d="M695 345 L 680 342 L 678 360 L 695 362 Z" fill="#B91C1C" opacity=".55"/>

  <!-- Sensor dome (L4 signifier) -->
  <circle cx="430" cy="228" r="10" fill="#EEF2FF" stroke="#2B4CFF" stroke-width="2"/>
  <circle cx="430" cy="228" r="3" fill="#2B4CFF"/>

  <!-- Horizon text -->
  <text x="60" y="60" fill="#475569" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="600" letter-spacing="1.5">AERODRIVE · DELIVERED</text>
  <text x="60" y="95" fill="#0F172A" font-family="Inter, system-ui, sans-serif" font-size="36" font-weight="300">Built to earn your trust.</text>
</svg>
